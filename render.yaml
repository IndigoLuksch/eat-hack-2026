services:
  - type: web
    name: eat-hack-demo
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DEMO_BACKEND
        value: openrouter
      - key: DEMO_MODEL
        value: google/gemini-2.5-flash-lite
      - key: BASELINE_MODEL
        value: anthropic/claude-opus-4.6
      - key: OPENROUTER_API_KEY
        sync: false
