<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Description</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section id="write">
      <div class="panel">
        <p class="label">Your task</p>
        <h1>Write a product description that is likely to appeal to this shopper's AI agent.</h1>
      </div>
      <div class="panel">
        <p class="label">Shopper request</p>
        <p id="shopper"></p>
      </div>
      <div class="panel product">
        <img id="photo" alt="">
        <div class="product-body">
          <h2 id="title"></h2>
          <ul id="features"></ul>
        </div>
      </div>
      <div class="panel">
        <label class="label" for="draft">Your description</label>
        <textarea id="draft" rows="6"></textarea>
        <div class="bar">
          <p id="count" class="count"><span id="words">0</span> / 70</p>
          <button type="button" id="rank" disabled>Compare with our model <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <section id="wait" hidden>
      <div id="wait-panel" class="panel busy">
        <div class="wait-row">
          <span class="spinner" aria-hidden="true"></span>
          <p id="status"><span id="status-text">Writing</span><span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
        </div>
        <button type="button" id="back" hidden>Again</button>
      </div>
    </section>

    <section id="result" hidden>
      <div class="board">
        <article id="you" class="panel col">
          <p class="who">You</p>
          <h1 class="outcome"></h1>
          <p class="mean"></p>
          <p class="mean-label">average rank</p>
          <p class="record"></p>
        </article>
        <article id="model" class="panel col">
          <p class="who">Model</p>
          <h1 class="outcome"></h1>
          <p class="mean"></p>
          <p class="mean-label">average rank</p>
          <p class="record"></p>
        </article>
        <div class="panel graph-span">
          <div class="graph"></div>
          <p class="graph-note">1st is best · ± 1 standard deviation</p>
        </div>
        <article class="panel">
          <p class="label">Your description</p>
          <p id="you-copy" class="copy"></p>
        </article>
        <article class="panel">
          <p class="label">Model's description</p>
          <p id="model-copy" class="copy"></p>
        </article>
      </div>
      <button type="button" id="again">Again</button>
    </section>
  </main>
  <script>
    const write = document.getElementById("write")
    const wait = document.getElementById("wait")
    const result = document.getElementById("result")
    const draft = document.getElementById("draft")
    const rankBtn = document.getElementById("rank")
    const words = document.getElementById("words")
    const statusText = document.getElementById("status-text")
    const waitPanel = document.getElementById("wait-panel")
    const back = document.getElementById("back")
    let current = null
    let intent = ""

    function show(which) {
      write.hidden = which !== "write"
      wait.hidden = which !== "wait"
      result.hidden = which !== "result"
      document.querySelector("main").classList.toggle("wide", which === "result")
    }

    function wordCount(value) {
      const text = value.trim()
      return text ? text.split(/\s+/).length : 0
    }

    function renderCase(data) {
      current = data
      intent = data.intent
      document.getElementById("photo").src = data.image
      document.getElementById("photo").alt = data.title
      document.getElementById("title").textContent = data.title
      const list = document.getElementById("features")
      list.replaceChildren()
      for (const feature of data.features) {
        const item = document.createElement("li")
        item.textContent = feature
        list.appendChild(item)
      }
      const spec = data.intents.find((item) => item.key === intent)
      document.getElementById("shopper").textContent = spec ? spec.shopper : ""
      draft.value = ""
      words.textContent = "0"
      rankBtn.disabled = true
      show("write")
      draft.focus({ preventScroll: true })
      window.scrollTo(0, 0)
    }

    function formatMean(value) {
      return Number(value).toFixed(1)
    }

    function spread(values) {
      const count = values.length
      if (count < 2) return 0
      const mean = values.reduce((sum, value) => sum + value, 0) / count
      const variance = values.reduce((sum, value) => sum + (value - mean) ** 2, 0) / (count - 1)
      return Math.sqrt(variance)
    }

    function svgEl(name, attrs, text) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", name)
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value)
      if (text != null) node.textContent = text
      return node
    }

    function comparisonGraph(you, model) {
      const svg = svgEl("svg", { viewBox: "0 0 720 210", role: "img" })
      const left = 78
      const right = 700
      const rows = [
        { spec: you, y: 58, klass: "series-you" },
        { spec: model, y: 118, klass: "series-model" },
      ]
      const x = (rank) => left + ((Math.min(8.5, Math.max(0.5, rank)) - 0.5) / 8) * (right - left)
      for (let rank = 1; rank <= 8; rank++) {
        const xx = x(rank)
        svg.append(svgEl("line", {
          x1: xx, x2: xx, y1: 28, y2: 154, class: "grid",
        }))
        svg.append(svgEl("text", {
          x: xx, y: 178, "text-anchor": "middle", class: "tick-label",
        }, String(rank)))
      }
      for (const row of rows) {
        const mean = Number(row.spec.mean)
        const deviation = spread(row.spec.places)
        const low = Math.max(0.5, mean - deviation)
        const high = Math.min(8.5, mean + deviation)
        const group = svgEl("g", { class: row.klass })
        group.append(svgEl("text", {
          x: 4, y: row.y + 5, class: "row-label",
        }, row.klass === "series-you" ? "You" : "Model"))
        group.append(svgEl("line", {
          x1: x(low), x2: x(high), y1: row.y, y2: row.y, class: "error",
        }))
        for (const end of [low, high]) {
          group.append(svgEl("line", {
            x1: x(end), x2: x(end), y1: row.y - 10, y2: row.y + 10, class: "error",
          }))
        }
        group.append(svgEl("circle", { cx: x(mean), cy: row.y, r: 7, class: "dot" }))
        svg.append(group)
      }
      const youMean = formatMean(you.mean)
      const modelMean = formatMean(model.mean)
      svg.setAttribute(
        "aria-label",
        "You averaged rank " + youMean + ". The model averaged rank " + modelMean + "."
      )
      return svg
    }

    function tally(userPlaces, modelPlaces) {
      const score = { user: 0, model: 0 }
      for (let i = 0; i < userPlaces.length; i++) {
        if (userPlaces[i] < modelPlaces[i]) score.user += 1
        else if (modelPlaces[i] < userPlaces[i]) score.model += 1
      }
      return score
    }

    function paintScore(id, side, mark, wins, total) {
      const column = document.getElementById(id)
      column.classList.remove("better", "worse")
      if (mark) column.classList.add(mark)
      column.querySelector(".mean").textContent = formatMean(side.mean)
      column.querySelector(".record").textContent = "Performed better in " + wins + " of " + total
    }

    function showResult(payload) {
      const you = payload.user
      const model = payload.model
      const total = you.places.length
      const score = tally(you.places, model.places)
      const youOutcome = document.querySelector("#you .outcome")
      const modelOutcome = document.querySelector("#model .outcome")
      youOutcome.textContent = payload.winner === "user" ? "You did better." : payload.winner === "tie" ? "It's a tie." : ""
      modelOutcome.textContent = payload.winner === "model" ? "The model did better." : payload.winner === "tie" ? "It's a tie." : ""
      paintScore("you", you, payload.winner === "user" ? "better" : payload.winner === "model" ? "worse" : "", score.user, total)
      paintScore("model", model, payload.winner === "model" ? "better" : payload.winner === "user" ? "worse" : "", score.model, total)
      document.querySelector("#result .graph").replaceChildren(comparisonGraph(you, model))
      document.getElementById("you-copy").textContent = you.text
      document.getElementById("model-copy").textContent = model.text
      show("result")
      window.scrollTo(0, 0)
    }

    function setWait(text, loading) {
      statusText.textContent = text
      waitPanel.classList.toggle("busy", loading)
    }

    function fail(message) {
      setWait(message, false)
      back.hidden = false
      show("wait")
    }

    async function loadCase(exclude) {
      const query = exclude ? "?exclude=" + encodeURIComponent(exclude) : ""
      const response = await fetch("/api/case" + query)
      if (!response.ok) throw new Error("case")
      renderCase(await response.json())
    }

    async function submit() {
      const text = draft.value.trim()
      if (!text || !current) return
      setWait("Writing", true)
      back.hidden = true
      show("wait")
      let response
      try {
        response = await fetch("/api/rank", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            parent_asin: current.parent_asin,
            intent,
            text,
          }),
        })
      } catch (error) {
        fail("Ranking failed.")
        return
      }
      if (!response.ok || !response.body) {
        fail("Ranking failed.")
        return
      }
      const reader = response.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ""
      let settled = false
      while (true) {
        const chunk = await reader.read()
        if (chunk.done) break
        buffer += decoder.decode(chunk.value, { stream: true })
        const parts = buffer.split("\n\n")
        buffer = parts.pop()
        for (const part of parts) {
          const line = part.split("\n").find((item) => item.startsWith("data: "))
          if (!line) continue
          let event
          try {
            event = JSON.parse(line.slice(6))
          } catch (error) {
            continue
          }
          if (event.phase === "writing") setWait("Writing", true)
          if (event.phase === "ranking") {
            setWait("Ranking " + event.done + " of " + event.total, true)
          }
          if (event.phase === "error") {
            settled = true
            fail(event.message || "Ranking failed.")
          }
          if (event.phase === "done") {
            settled = true
            showResult(event.result)
          }
        }
      }
      if (!settled) fail("Ranking failed.")
    }

    draft.addEventListener("input", () => {
      const count = wordCount(draft.value)
      words.textContent = String(count)
      rankBtn.disabled = count === 0
    })
    rankBtn.addEventListener("click", () => { submit() })
    document.getElementById("again").addEventListener("click", () => {
      loadCase(current && current.parent_asin).catch(() => fail("Ranking failed."))
    })
    back.addEventListener("click", () => {
      loadCase(current && current.parent_asin).catch(() => fail("Ranking failed."))
    })
    loadCase("").catch(() => fail("Ranking failed."))
  </script>
</body>
</html>
