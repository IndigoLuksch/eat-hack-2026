<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Description</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section id="write">
      <div class="panel">
        <p class="label">Your task</p>
        <h1>Write a product description that is likely to appeal to this shopper's AI agent.</h1>
      </div>
      <div class="panel">
        <p class="label">Shopper request</p>
        <p id="shopper"></p>
      </div>
      <div class="panel product">
        <img id="photo" alt="">
        <div class="product-body">
          <h2 id="title"></h2>
          <ul id="features"></ul>
        </div>
      </div>
      <div class="panel">
        <label class="label" for="draft">Your description</label>
        <textarea id="draft" rows="6"></textarea>
        <div class="bar">
          <p id="count" class="count"><span id="words">0</span> / 70</p>
          <button type="button" id="rank" disabled>Compare with our model <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <section id="wait" hidden>
      <div class="panel">
        <p id="status">Writing</p>
        <button type="button" id="back" hidden>Again</button>
      </div>
    </section>

    <section id="result" hidden>
      <div id="verdict" class="panel verdict">
        <h1 id="verdict-title"></h1>
        <p id="verdict-detail"></p>
      </div>
      <div class="cols">
        <article id="you" class="panel col">
          <p class="who">You</p>
          <p class="mean"></p>
          <p class="mean-label">average place</p>
          <p class="record"></p>
        </article>
        <article id="model" class="panel col">
          <p class="who">Model</p>
          <p class="mean"></p>
          <p class="mean-label">average place</p>
          <p class="record"></p>
        </article>
      </div>
      <div class="panel">
        <p id="runs-label" class="label">Rankings</p>
        <div class="run run-head">
          <span></span>
          <span>You</span>
          <span>Model</span>
        </div>
        <ol id="runs"></ol>
      </div>
      <div class="panel">
        <p class="label">Your description</p>
        <p id="you-copy" class="copy"></p>
      </div>
      <div class="panel">
        <p class="label">Model's description</p>
        <p id="model-copy" class="copy"></p>
      </div>
      <button type="button" id="again">Again</button>
    </section>
  </main>
  <script>
    const write = document.getElementById("write")
    const wait = document.getElementById("wait")
    const result = document.getElementById("result")
    const draft = document.getElementById("draft")
    const rankBtn = document.getElementById("rank")
    const words = document.getElementById("words")
    const status = document.getElementById("status")
    const back = document.getElementById("back")
    let current = null
    let intent = ""

    function show(which) {
      write.hidden = which !== "write"
      wait.hidden = which !== "wait"
      result.hidden = which !== "result"
    }

    function wordCount(value) {
      const text = value.trim()
      return text ? text.split(/\s+/).length : 0
    }

    function renderCase(data) {
      current = data
      intent = data.intent
      document.getElementById("photo").src = data.image
      document.getElementById("photo").alt = data.title
      document.getElementById("title").textContent = data.title
      const list = document.getElementById("features")
      list.replaceChildren()
      for (const feature of data.features) {
        const item = document.createElement("li")
        item.textContent = feature
        list.appendChild(item)
      }
      const spec = data.intents.find((item) => item.key === intent)
      document.getElementById("shopper").textContent = spec ? spec.shopper : ""
      draft.value = ""
      words.textContent = "0"
      rankBtn.disabled = true
      show("write")
      draft.focus({ preventScroll: true })
      window.scrollTo(0, 0)
    }

    function formatMean(value) {
      return Number(value).toFixed(1)
    }

    function ordinal(place) {
      const mod100 = place % 100
      if (mod100 >= 11 && mod100 <= 13) return place + "th"
      const mod10 = place % 10
      if (mod10 === 1) return place + "st"
      if (mod10 === 2) return place + "nd"
      if (mod10 === 3) return place + "rd"
      return place + "th"
    }

    function tally(userPlaces, modelPlaces) {
      const score = { user: 0, model: 0 }
      for (let i = 0; i < userPlaces.length; i++) {
        if (userPlaces[i] < modelPlaces[i]) score.user += 1
        else if (modelPlaces[i] < userPlaces[i]) score.model += 1
      }
      return score
    }

    function paintScore(id, side, mark, wins, total) {
      const column = document.getElementById(id)
      column.classList.remove("better", "worse")
      if (mark) column.classList.add(mark)
      column.querySelector(".mean").textContent = formatMean(side.mean)
      column.querySelector(".record").textContent = "Ahead in " + wins + " of " + total
    }

    function showResult(payload) {
      const you = payload.user
      const model = payload.model
      const total = you.places.length
      const score = tally(you.places, model.places)
      const verdict = document.getElementById("verdict")
      const title = document.getElementById("verdict-title")
      const detail = document.getElementById("verdict-detail")
      const youMean = formatMean(you.mean)
      const modelMean = formatMean(model.mean)
      verdict.classList.remove("you", "model")
      if (payload.winner === "tie") {
        title.textContent = "It's a tie."
        detail.textContent = "You both averaged place " + youMean + ". 1st is best."
        if (score.user !== score.model) {
          const who = score.user > score.model ? "You were" : "The model was"
          detail.textContent = "You both averaged place " + youMean + ", so neither description wins. " + who + " ahead more often. 1st is best."
        }
      } else if (payload.winner === "user") {
        verdict.classList.add("you")
        title.textContent = "You did better."
        detail.textContent = "Your average place was " + youMean + ". The model's was " + modelMean + ". 1st is best."
        if (score.user < score.model) {
          detail.textContent += " The model was ahead more often, but your leads were larger."
        }
      } else {
        verdict.classList.add("model")
        title.textContent = "The model did better."
        detail.textContent = "The model's average place was " + modelMean + ". Yours was " + youMean + ". 1st is best."
        if (score.model < score.user) {
          detail.textContent += " You were ahead more often, but the model's leads were larger."
        }
      }
      paintScore("you", you, payload.winner === "user" ? "better" : payload.winner === "model" ? "worse" : "", score.user, total)
      paintScore("model", model, payload.winner === "model" ? "better" : payload.winner === "user" ? "worse" : "", score.model, total)
      document.getElementById("runs-label").textContent = total === 1 ? "1 ranking" : total + " rankings"
      const runs = document.getElementById("runs")
      runs.replaceChildren()
      for (let i = 0; i < total; i++) {
        const row = document.createElement("li")
        row.className = "run"
        const yours = document.createElement("span")
        const theirs = document.createElement("span")
        yours.textContent = ordinal(you.places[i])
        theirs.textContent = ordinal(model.places[i])
        if (you.places[i] < model.places[i]) yours.className = "ahead"
        else if (model.places[i] < you.places[i]) theirs.className = "ahead"
        const index = document.createElement("span")
        index.className = "run-n"
        index.textContent = String(i + 1)
        row.append(index, yours, theirs)
        runs.append(row)
      }
      document.getElementById("you-copy").textContent = you.text
      document.getElementById("model-copy").textContent = model.text
      show("result")
      window.scrollTo(0, 0)
    }

    function fail(message) {
      status.textContent = message
      back.hidden = false
      show("wait")
    }

    async function loadCase(exclude) {
      const query = exclude ? "?exclude=" + encodeURIComponent(exclude) : ""
      const response = await fetch("/api/case" + query)
      if (!response.ok) throw new Error("case")
      renderCase(await response.json())
    }

    async function submit() {
      const text = draft.value.trim()
      if (!text || !current) return
      status.textContent = "Writing"
      back.hidden = true
      show("wait")
      let response
      try {
        response = await fetch("/api/rank", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            parent_asin: current.parent_asin,
            intent,
            text,
          }),
        })
      } catch (error) {
        fail("Ranking failed.")
        return
      }
      if (!response.ok || !response.body) {
        fail("Ranking failed.")
        return
      }
      const reader = response.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ""
      let settled = false
      while (true) {
        const chunk = await reader.read()
        if (chunk.done) break
        buffer += decoder.decode(chunk.value, { stream: true })
        const parts = buffer.split("\n\n")
        buffer = parts.pop()
        for (const part of parts) {
          const line = part.split("\n").find((item) => item.startsWith("data: "))
          if (!line) continue
          let event
          try {
            event = JSON.parse(line.slice(6))
          } catch (error) {
            continue
          }
          if (event.phase === "writing") status.textContent = "Writing"
          if (event.phase === "ranking") {
            status.textContent = "Ranking " + event.done + " of " + event.total
          }
          if (event.phase === "error") {
            settled = true
            fail(event.message || "Ranking failed.")
          }
          if (event.phase === "done") {
            settled = true
            showResult(event.result)
          }
        }
      }
      if (!settled) fail("Ranking failed.")
    }

    draft.addEventListener("input", () => {
      const count = wordCount(draft.value)
      words.textContent = String(count)
      rankBtn.disabled = count === 0
    })
    rankBtn.addEventListener("click", () => { submit() })
    document.getElementById("again").addEventListener("click", () => {
      loadCase(current && current.parent_asin).catch(() => fail("Ranking failed."))
    })
    back.addEventListener("click", () => {
      loadCase(current && current.parent_asin).catch(() => fail("Ranking failed."))
    })
    loadCase("").catch(() => fail("Ranking failed."))
  </script>
</body>
</html>
